# Disabled temporarily. Move this file back to .github/workflows/ to re-enable it.
name: computer-use macos

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/computer-use-macos.yml"
      - "computer-use-macos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/codegen/xai-grok-agent/**"
      - "crates/codegen/xai-grok-mcp/**"
      - "crates/codegen/xai-grok-pager/**"
      - "crates/codegen/xai-grok-pager-bin/**"
      - "crates/codegen/xai-grok-sampler/**"
      - "crates/codegen/xai-grok-sampling-types/**"
      - "crates/codegen/xai-grok-shell/**"
      - "crates/codegen/xai-grok-tools/**"
      - "crates/codegen/xai-grok-workspace*/**"
      - "crates/common/xai-tool-*/**"
  pull_request:
    paths:
      - ".github/workflows/computer-use-macos.yml"
      - "computer-use-macos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/codegen/xai-grok-agent/**"
      - "crates/codegen/xai-grok-mcp/**"
      - "crates/codegen/xai-grok-pager/**"
      - "crates/codegen/xai-grok-pager-bin/**"
      - "crates/codegen/xai-grok-sampler/**"
      - "crates/codegen/xai-grok-sampling-types/**"
      - "crates/codegen/xai-grok-shell/**"
      - "crates/codegen/xai-grok-tools/**"
      - "crates/codegen/xai-grok-workspace*/**"
      - "crates/common/xai-tool-*/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-use-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: git
  CARGO_TERM_COLOR: always
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
  RUST_BACKTRACE: "1"

jobs:
  contracts:
    name: native and rust contracts
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require Apple Silicon macOS 14 or newer
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          macos_major="$(/usr/bin/sw_vers -productVersion | /usr/bin/cut -d. -f1)"
          test "${macos_major}" -ge 14
          /usr/bin/sw_vers
          /usr/bin/xcodebuild -version
          swift --version

      - name: Select repository Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Rust build inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: computer-use-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            computer-use-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate native packaging inputs
        shell: bash
        run: |
          for script in computer-use-macos/scripts/*.sh; do
            /bin/bash -n "${script}"
          done
          /usr/bin/plutil -lint computer-use-macos/Resources/Info.plist
          /usr/bin/plutil -lint computer-use-macos/Resources/GrokComputerUse.entitlements

      - name: Run Swift tests
        shell: bash
        run: swift test --package-path computer-use-macos --parallel

      - name: Build and verify ad-hoc signed app bundle
        shell: bash
        env:
          GROK_COMPUTER_USE_CODESIGN_IDENTITY: "-"
        run: |
          computer-use-macos/scripts/build-app.sh release
          app_path="computer-use-macos/dist/Grok Computer Use.app"
          relay_path="${app_path}/Contents/MacOS/grok-computer-use-mcp"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${app_path}"
          /usr/bin/codesign --verify --strict --verbose=2 "${relay_path}"
          /usr/bin/codesign -d --verbose=4 "${app_path}" 2>&1 \
            | /usr/bin/grep -Fx "Identifier=com.xai.grok.computer-use"
          /usr/bin/codesign -d --verbose=4 "${relay_path}" 2>&1 \
            | /usr/bin/grep -Fx "Identifier=com.xai.grok.computer-use.mcp"

      - name: Run MCP computer-use contract tests
        shell: bash
        run: cargo test --locked -p xai-grok-mcp --lib computer_use

      - name: Run protected sampler tests
        shell: bash
        run: |
          cargo test --locked -p xai-grok-sampler --lib protected_overlay
          cargo test --locked -p xai-grok-sampler --test protected_overlay_wire

      - name: Run shell computer-use contract tests
        shell: bash
        run: |
          cargo test --locked -p xai-grok-shell --lib computer_use
          for test_filter in \
            retains_only_one_direct_action_for_the_exact_snapshot \
            releases_for_no_action_or_one_observation \
            rejects_tunneled_mixed_multiple_and_malformed_actions \
            reserved_names_are_sensitive_only_with_active_capability \
            trusted_call_must_be_the_only_call_in_its_model_turn \
            protected_arguments_are_redacted_without_losing_exact_handoff_identity \
            trusted_failures_and_snapshotless_actions_require_session_invalidation
          do
            cargo test --locked -p xai-grok-shell --lib "${test_filter}"
          done

      - name: Check CLI integration
        shell: bash
        run: cargo check --locked -p xai-grok-pager-bin

      - name: Record certification boundary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Computer-use CI scope"
            echo
            echo "This job validates fake-backed Swift tests, Rust contracts, app assembly, and ad-hoc code-seal integrity."
            echo "It does not validate live Screen Recording or Accessibility TCC grants, Developer ID signing, notarization, or Gatekeeper acceptance."
            echo "Those release checks require a manually provisioned Apple Silicon Mac with a stable production signing identity."
          } >> "${GITHUB_STEP_SUMMARY}"
