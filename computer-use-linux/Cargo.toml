[workspace]
resolver = "2"
members = [
    "computer-use-core",
    "grok-computer-use-daemon",
    "grok-computer-use-mcp",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
base64 = "0.22"
hmac = "0.12"
libc = "0.2"
png = "0.17"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
uuid = { version = "1", features = ["v4"] }
x11rb = { version = "0.13", features = ["composite", "xtest"] }

[profile.release]
panic = "abort"
strip = true
